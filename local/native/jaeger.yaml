extensions:
  jaeger_storage:
    backends:
      local_memory:
        memory:
          max_traces: 1000
  jaeger_query:
    storage:
      traces: local_memory
    http:
      endpoint: 127.0.0.1:16686
    grpc:
      endpoint: 127.0.0.1:16685
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:14317
processors:
  batch:
    timeout: 200ms
    send_batch_size: 128
exporters:
  jaeger_storage_exporter:
    trace_storage: local_memory
service:
  extensions:
  - jaeger_storage
  - jaeger_query
  pipelines:
    traces:
      receivers:
      - otlp
      processors:
      - batch
      exporters:
      - jaeger_storage_exporter
  telemetry:
    logs:
      level: warn
    metrics:
      level: none
      readers: []
