receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:14318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  transform/allowlist:
    error_mode: propagate
    trace_statements:
    - context: resource
      statements:
      - keep_keys(attributes, ["service.name", "service.namespace", "service.version",
        "deployment.environment.name", "lab.schema.version"])
    - context: span
      statements:
      - keep_keys(attributes, ["http.request.method", "http.route", "http.response.status_code",
        "lab.operation", "lab.outcome", "lab.model.mode", "lab.model.name", "lab.steps",
        "lab.tool.calls", "lab.retry", "lab.retrieval.count", "lab.error.type", "lab.schema.version"])
    metric_statements:
    - context: resource
      statements:
      - keep_keys(attributes, ["service.name", "service.namespace", "service.version",
        "deployment.environment.name", "lab.schema.version"])
    - context: datapoint
      statements:
      - keep_keys(attributes, ["lab.operation", "lab.outcome"])
  batch:
    timeout: 200ms
    send_batch_size: 128
    send_batch_max_size: 256
exporters:
  otlp_grpc/jaeger:
    endpoint: 127.0.0.1:14317
    tls:
      insecure: true
    sending_queue:
      enabled: true
      queue_size: 256
      num_consumers: 2
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 15s
  prometheus:
    endpoint: 127.0.0.1:18889
    resource_to_telemetry_conversion:
      enabled: false
service:
  telemetry:
    metrics:
      readers:
      - pull:
          exporter:
            prometheus:
              host: 127.0.0.1
              port: 18888
  pipelines:
    traces:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - transform/allowlist
      - batch
      exporters:
      - otlp_grpc/jaeger
    metrics:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - transform/allowlist
      - batch
      exporters:
      - prometheus
