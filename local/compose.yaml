services:
  collector:
    image: otel/opentelemetry-collector-contrib:0.164.0@sha256:340c9ca6a36617084c6661bdc4f0fe92b7cda5a805d61673ec8db375fddc522b
    command: [--config=/etc/otelcol/config.yaml]
    volumes: ["./collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["127.0.0.1:18889:8889", "127.0.0.1:18888:8888"]
    depends_on: [jaeger]
    mem_limit: 192m
    cpus: 1.0
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.22.0@sha256:836b967b5abcf1f7758066aa6b348619267a2f1459f72d472840570f9bd88a17
    ports: ["127.0.0.1:16686:16686"]
    mem_limit: 256m
    cpus: 1.0
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
