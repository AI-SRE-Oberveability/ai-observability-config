{{- if .Values.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: {{ .Release.Namespace }}
  labels: {app.kubernetes.io/name: otel-collector}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
  namespace: {{ .Release.Namespace }}
  labels: {app.kubernetes.io/name: otel-collector}
data:
  config.yaml: |
{{ .Files.Get "files/config.yaml" | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: {{ .Release.Namespace }}
  labels: {app.kubernetes.io/name: otel-collector}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: otel-collector}
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: 4317}
    - {name: otlp-http, port: 4318, targetPort: 4318}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: {{ .Release.Namespace }}
  labels: {app.kubernetes.io/name: otel-collector}
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels: {app.kubernetes.io/name: otel-collector}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
        ai-lab.example/profile: {{ .Values.profile | quote }}
      annotations:
        checksum/config: {{ .Files.Get "files/config.yaml" | sha256sum }}
    spec:
      serviceAccountName: otel-collector
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: collector
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          args: ["--config=/etc/otelcol/config.yaml"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          ports:
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
            - {name: health, containerPort: 13133}
          startupProbe:
            httpGet: {path: /, port: health}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /, port: health}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /, port: health}
            periodSeconds: 10
          volumeMounts:
            - {name: config, mountPath: /etc/otelcol, readOnly: true}
      volumes:
        - name: config
          configMap: {name: otel-collector}
{{- end }}
