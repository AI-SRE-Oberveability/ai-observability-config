name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install hash-locked CI dependencies
        run: python -m pip install --require-hashes -r requirements-ci.txt
      - run: ruff check scripts
      - run: ruff format --check scripts
      - run: python scripts/check_config.py
      - name: Verify locked dependencies and offline disabled/ownership renders
        env:
          CHART_INPUT_CACHE: ${{ runner.temp }}/chart-inputs
        run: python scripts/check_dependencies.py --restore
      - name: Validate Compose
        run: docker compose -f local/compose.yaml config --quiet
      - name: Validate pinned Collector configuration
        run: docker compose -f local/compose.yaml run --rm --no-deps collector validate --config=/etc/otelcol/config.yaml
      - name: Validate Collector chart profiles and negative cases
        env:
          CHART_INPUT_CACHE: ${{ runner.temp }}/chart-inputs
        run: python scripts/check_collector_chart.py --restore --output "$RUNNER_TEMP/collector-check.json" --config-out "$RUNNER_TEMP/collector.yaml"
      - name: Validate generated Kubernetes Collector config in the pinned distribution
        run: >-
          docker run --rm --network none --read-only --user 10001:10001
          --cap-drop ALL --security-opt no-new-privileges
          -v "$RUNNER_TEMP/collector.yaml:/etc/otelcol/config.yaml:ro"
          otel/opentelemetry-collector-contrib:0.164.0@sha256:340c9ca6a36617084c6661bdc4f0fe92b7cda5a805d61673ec8db375fddc522b
          validate --config=/etc/otelcol/config.yaml
      - name: Validate Jaeger chart profiles and negative cases
        env:
          CHART_INPUT_CACHE: ${{ runner.temp }}/chart-inputs
        run: python scripts/check_jaeger_chart.py --restore --output "$RUNNER_TEMP/jaeger-check.json" --config-out "$RUNNER_TEMP/jaeger.yaml"
      - name: Validate generated Jaeger config in the pinned distribution
        run: >-
          docker run --rm --network none --read-only --user 10001:10001
          --cap-drop ALL --security-opt no-new-privileges
          -v "$RUNNER_TEMP/jaeger.yaml:/etc/otelcol/config.yaml:ro"
          cr.jaegertracing.io/jaegertracing/jaeger:2.22.0@sha256:836b967b5abcf1f7758066aa6b348619267a2f1459f72d472840570f9bd88a17
          validate --config=/etc/otelcol/config.yaml
